{
  "server": {
    "host": "127.0.0.1",
    "port": 1933
  },
  "storage": {
    "workspace": "D:/openviking/workspace",
    "agfs": {
      "mode": "binding-client",
      "timeout": 10,
      "backend": "local"
    }
  },
  "log": {
    "level": "INFO",
    "output": "stdout"
  },
  "embedding": {
    "dense": {
      "provider": "openai",
      "api_base": "https://api.openai.com/v1",
      "api_key": "replace-with-your-embedding-api-key",
      "model": "text-embedding-3-small",
      "dimension": 1536
    },
    "max_concurrent": 10
  },
  "vlm": {
    "provider": "openai",
    "api_base": "https://api.openai.com/v1",
    "api_key": "replace-with-your-vlm-api-key",
    "model": "gpt-4o",
    "max_concurrent": 100
  }
}
